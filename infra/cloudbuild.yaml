steps:
  # 1. Run unit tests and typecheck before build
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'typecheck']
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']

  # 2. Build multi-stage Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/haq-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/haq-ai:latest'
      - '.'

  # 3. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/haq-ai:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/haq-ai:latest']

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'infra/cloudrun-service.yaml'
      - '--region=asia-south1'

images:
  - 'gcr.io/$PROJECT_ID/haq-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/haq-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
